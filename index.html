<style>

.st{text-align:center;background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:6px 14px}.st b{display:block;font-size:22px;color:var(--ac)}.st span{font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:.08em}

table{border-collapse:collapse;width:100%;font-size:14px}td{padding:9px 4px;border-bottom:1px solid var(--bd);vertical-align:top}td:first-child{color:var(--mu);width:44px;font-weight:600}tr:last-child td{border:0}tr.now td{color:var(--ac)}
.k{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.k div{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:10px;text-align:center}.k b{display:block;font-size:20px}

</style></head><body>
<div class="top"><div><h1 id="gr">Let's train</h1><div class="sub" id="sb"></div></div><div class="st"><b id="sk">0</b><span>day streak</span></div></div>
<div id="v"></div><div id="ts">Saved</div>
<div class="tabs"><button data-v="t">Today</button><button data-v="l">Log</button><button data-v="s">Strength</button><button data-v="w">Weight</button><button data-v="p">Program</button></div>
<script>
const G=(()=>{const m1='Back squat 4x8, RDL 3x10, leg press 3x12, leg curl 3x12, calf raise 4x15, knee raise 3x12',w1='Bench 4x8, pull-up/pulldown 4x10, OHP 3x10, chest-supported row 3x10, lateral raise 3x15, biceps 3x12, triceps 3x12',f1='Deadlift 3x5, front squat 3x8, incline DB press 3x10, seated row 3x12, walking lunges 3x20, farmers carry 3x40 m, plank 3x60 s',m2=m1.replace('squat 4x8','squat 4x6').replace('RDL 3x10','RDL 3x8'),w2='Bench 4x6, pull-up/pulldown 4x8, OHP 3x8, chest-supported row 3x10, lateral raise 3x15, biceps 3x12, triceps 3x12',m3='Back squat 3x6, RDL 2x8, leg press 2x12, leg curl 2x12, calf raise 3x15, knee raise 2x12',f3='Deadlift 2x5, front squat 2x8, incline DB press 2x10, seated row 2x12, walking lunges 2x20, farmers carry 2x40 m, plank 2x60 s';return[[m1,w1,f1],[m2,w2,f1],[m3,w2,f3],[m3,w2,f3]]})();
const S1=['3 km run/walk (2/1)','3.5 km run/walk (3/1)','4 km run/walk (3/1)','3 km easy','4 km run/walk (4/1)','4 km run/walk (6/1)','4.5 km run/walk (8/1)','3.5 km easy','4.5 km, try continuous','5 km run/walk (10/1)','5 km continuous, Zone 2','4 km easy'],
T2=[[4,1],[5,1],[5,1],[3,1],[5,1],[6,1],[6,1],[4,1],[6,1],[5,1.2],[5,1.2],[3,1]],TH2=[40,42,45,30,45,47,50,35,50,50,50,35],S2=[6,7,8,5,8,8.5,9,6,9,9.5,10,6],
TE=[15,18,20,12,20,22,25,15,25,20,0,0],TH3=[50,52,55,40,55,57,60,45,60,55,30,40],S3=[10,11,12,8,12,13,14,9,14,12,10,8],
TQ=['T25','I6','T25','T15','I6','T30','I6','T15','T30','I6','T30','TT'],TH4=[60,60,60,45,60,60,60,45,60,60,60,45],S4=[12,13,14,9,14,15,16,10,15,16,16,10],
PN=['Base (Months 1-3)','Build (Months 4-6)','Specific build (Months 7-9)','Peak base (Months 10-12)'],DN=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],R=[.5,.5,.25,.1];
function run(w){const p=(w-1)/12|0,i=(w-1)%12,b=i/4|0,wu='1.5 km warm-up, ',cd=', 1 km cool-down';
if(p==0)return[['8 x (2 min run / 1 min walk)','6 x (4 min run / 1 min walk)','4 x (6 min run / 1 min walk)'][b],['30 min run/walk (3 min run / 1 min walk)','35-40 min continuous, Zone 2','45 min continuous, Zone 2'][b],S1[i]];
if(p==1)return['1 km warm-up, '+T2[i][0]+' x '+T2[i][1]+' km moderate (RPE 6-7, 90 s walk/jog)'+cd,TH2[i]+' min continuous, Zone 2',S2[i]+' km long run'];
if(p==2)return[i==10?wu+'3 x 1 km at 10 km race pace (sharp, not hard)'+cd:i==11?'30 min easy, Zone 2':wu+TE[i]+' min tempo (RPE 7)'+cd,TH3[i]+' min continuous, Zone 2',i==10?'10 KM RACE (or time trial)':S3[i]+' km long run'];
const q=TQ[i];return[q=='TT'?'2 km warm-up, 5 km TIME TRIAL, 1 km cool-down':q=='I6'?'2 km warm-up, 6 x 1 km at 10 km pace or faster (RPE 8, 90 s jog)'+cd:wu+q.slice(1)+' min tempo (RPE 7)'+cd,TH4[i]+' min continuous, Zone 2',S4[i]+' km long run']}
function sess(w){const p=(w-1)/12|0,g=G[p],r=run(w),d=w%4==0?' | DELOAD: gym -40% sets, 85% loads, running ~60%':'';
return[['Gym - Lower',g[0]+d],['Run - Quality',r[0]+d],['Gym - Upper',g[1]+d],['Run - Easy',r[1]+d],['Gym - Full body',g[2]+d],['Run - Long',r[2]+d],['Rest','30-40 min walk + stretching']]}
let S;try{S=JSON.parse(localStorage.getItem('hx'))}catch(e){}S=S||{start:'2026-10-19',w0:92,log:{}};S.str=S.str||{};
const sv=()=>{try{localStorage.setItem('hx',JSON.stringify(S))}catch(e){}},$=i=>document.getElementById(i);
const U=s=>Date.parse(s+'T00:00:00Z'),iso=u=>new Date(u).toISOString().slice(0,10),DAY=864e5;
const td=(()=>{const n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0')})();
const info=s=>{const n=Math.floor((U(s)-U(S.start))/DAY);return{n,w:Math.floor(n/7)+1,d:((n%7)+7)%7}};
const tw=w=>S.w0-(R[0]*Math.min(w,12)+R[1]*Math.max(0,Math.min(w,24)-12)+R[2]*Math.max(0,Math.min(w,36)-24)+R[3]*Math.max(0,w-36));
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null,f1=x=>x==null?'-':x.toFixed(1),inP=i=>i.n>=0&&i.w<=48;
const toast=m=>{const t=$('ts');t.textContent=m;t.style.opacity=1;setTimeout(()=>t.style.opacity=0,1400)};
function wk(w){const o={wt:[],km:0,y:0};for(let i=0;i<7;i++){const l=S.log[iso(U(S.start)+((w-1)*7+i)*DAY)];if(!l)continue;if(l.wt)o.wt.push(+l.wt);o.km+=+l.km||0;if(l.tr=='Y')o.y++}return o}
function streak(){let n=0,d=U(td);if(!(S.log[td]||{}).tr)d-=DAY;for(;;d-=DAY){const t=(S.log[iso(d)]||{}).tr;if(t=='Y')n++;else if(t!='R')break}return n}
const PD=['Build the running habit and a strength base without injury. Run/walk intervals, moderate gym loads.','Longer moderate runs, tempo-free. Heavier main lifts (squat and bench 4x6).','Tempo running, fewer gym sets so legs recover, 10 km race in week 35.','Peak mileage: long runs to 16 km, 6x1 km faster, 5 km time trial to set Hyrox pace.'];
const RM=[['Months 1-3','Run/walk foundation, strength at moderate loads'],['Months 4-6','Continuous runs, heavier main lifts'],['Months 7-9','Tempo runs and a 10 km race'],['Months 10-12','Peak base, 16 km long run, 5 km time trial'],['Months 13-15 (Oct 2027 - Jan 2028)','Hyrox-specific block: sleds, wall balls, simulations, taper']];
let tab='t',cd=td,pw=null;const V=$('v');
function head(){const i=info(td),h=new Date().getHours();$('gr').textContent=h<12?'Good morning':h<18?"Let's train":'Good evening';$('sb').textContent=i.n<0?'Starts in '+(-i.n)+' days':i.w>48?'Programme complete. Next: Hyrox block':'Week '+i.w+' of 48 | '+PN[(i.w-1)/12|0].split(' (')[0]+(i.w%4==0?' | Deload':'');$('sk').textContent=streak()}
const lab=k=>{const i=info(k);return inP(i)?DN[i.d]+' | '+sess(i.w)[i.d][0]:DN[(i.d)]};
function today(){const i=info(cd),l=S.log[cd]||{};let h='<div class="row"><button class="btn" style="flex:0 0 48px" onclick="mv(-1)">&lt;</button><div style="text-align:center"><b>'+cd+'</b><div class="mu">'+(cd==td?'Today':'')+'</div></div><button class="btn" style="flex:0 0 48px" onclick="mv(1)">&gt;</button></div>';
if(!inP(i))h+='<div class="c">Outside the 48-week plan. Change the start date in Program.</div>';else{const s=sess(i.w)[i.d];h+='<div class="c'+(i.w%4==0?' dl':'')+'"><span class="b">Week '+i.w+'</span><span class="b">'+DN[i.d]+'</span><div class="big">'+s[0]+'</div><div>'+s[1]+'</div></div>'}
h+='<h2>Log this session</h2><div class="c"><label style="margin-top:0">Trained?</label><div class="seg" id="tr">'+[['Y','Done'],['N','Missed'],['R','Rest']].map(x=>'<button data-t="'+x[0]+'" class="'+(l.tr==x[0]?'on':'')+'">'+x[1]+'</button>').join('')+'</div><div class="g"><div><label>Bodyweight (kg)</label><input id="wt" type="number" step=".1" value="'+(l.wt||'')+'"></div><div><label>Run distance (km)</label><input id="km" type="number" step=".1" value="'+(l.km||'')+'"></div><div><label>Sleep (hrs)</label><input id="sl" type="number" step=".25" value="'+(l.sl||'')+'"></div><div><label>Resting HR</label><input id="hr" type="number" value="'+(l.hr||'')+'"></div></div><label>Energy (1-5)</label><input id="en" type="number" min="1" max="5" value="'+(l.en||'')+'"><label>Notes</label><textarea id="nt" rows="2">'+(l.nt||'')+'</textarea><button class="btn p" id="sv">Save entry</button></div>';
V.innerHTML=h;let t=l.tr;document.querySelectorAll('#tr button').forEach(b=>b.onclick=()=>{t=b.dataset.t;document.querySelectorAll('#tr button').forEach(x=>x.classList.toggle('on',x==b))});
$('sv').onclick=()=>{S.log[cd]={tr:t,wt:$('wt').value,km:$('km').value,sl:$('sl').value,hr:$('hr').value,en:$('en').value,nt:$('nt').value};sv();head();toast('Saved')}}
const mv=n=>{cd=iso(U(cd)+n*DAY);today()};
function hist(){const ks=Object.keys(S.log).filter(k=>Object.values(S.log[k]).some(v=>v)).sort().reverse();const T={Y:'Done',N:'Missed',R:'Rest'};
V.innerHTML='<h2>History</h2><div class="c">'+(ks.length?ks.map(k=>{const l=S.log[k];return'<div class="hi"><div class="row"><b>'+k+'</b><span class="b" style="margin:0">'+(T[l.tr]||'Logged')+'</span></div><div class="mu">'+lab(k)+'</div><div class="mu">'+[l.km&&l.km+' km',l.wt&&l.wt+' kg',l.sl&&l.sl+' h sleep',l.hr&&l.hr+' bpm'].filter(Boolean).join(' | ')+'</div>'+(l.nt?'<div>'+l.nt.replace(/</g,'&lt;')+'</div>':'')+'</div>'}).join(''):'<span class="mu">No entries yet. Log your first session on Today.</span>')+'</div>'}
function weight(){const c=info(td),last=Math.min(48,Math.max(1,c.w)),ws=Object.keys(S.log).filter(k=>S.log[k].wt).sort();let lw=ws.length?+S.log[ws[ws.length-1]].wt:null;
const lo=Math.floor(Math.min(tw(48),S.w0,...ws.map(k=>+S.log[k].wt))-1),hi=Math.ceil(S.w0)+1,X=w=>20+(w-1)*(300/47),Y=v=>10+(hi-v)*(140/(hi-lo));let tl=[],dots='';
for(let w=1;w<=48;w++){tl.push(X(w)+','+Y(tw(w)));const a=avg(wk(w).wt);if(a!=null)dots+='<circle cx="'+X(w)+'" cy="'+Y(a)+'" r="3.5" fill="var(--ac)"/>'}
V.innerHTML='<div class="k"><div><b>'+(lw==null?'-':lw.toFixed(1))+'</b><span class="mu">now (kg)</span></div><div><b>'+(lw==null?'-':(S.w0-lw).toFixed(1))+'</b><span class="mu">lost (kg)</span></div><div><b>'+f1(tw(last))+'</b><span class="mu">target</span></div></div><h2>Bodyweight</h2><div class="c"><div class="row"><input id="nw" type="number" step=".1" placeholder="kg" style="flex:1"><button class="btn" style="flex:0 0 90px" id="ad">Add</button></div></div><div class="c"><svg viewBox="0 0 330 160" width="100%"><polyline points="'+tl.join(' ')+'" fill="none" stroke="var(--mu)" stroke-width="2" stroke-dasharray="4 3"/>'+dots+'<text x="20" y="158" font-size="9" fill="var(--mu)">Wk 1</text><text x="290" y="158" font-size="9" fill="var(--mu)">Wk 48</text></svg><div class="mu">Dashed = target. Dots = weekly average.</div></div><h2>Recent weigh-ins</h2><div class="c">'+(ws.length?ws.slice(-14).reverse().map(k=>'<div class="hi row"><span>'+k+'</span><b>'+S.log[k].wt+' kg</b></div>').join(''):'<span class="mu">No weigh-ins yet.</span>')+'</div>';
$('ad').onclick=()=>{const v=$('nw').value;if(!v)return;(S.log[td]=S.log[td]||{}).wt=v;sv();toast('Added');weight()}}
function prog(){const c=info(td);if(pw==null)pw=Math.min(48,Math.max(1,c.w));let o='';for(let w=1;w<=48;w++)o+='<option value="'+w+'"'+(w==pw?' selected':'')+'>Week '+w+(w%4==0?' (deload)':'')+'</option>';
let h='<h2>Weekly plan</h2><select id="ws">'+o+'</select><div class="c'+(pw%4==0?' dl':'')+'"><span class="b">'+PN[(pw-1)/12|0]+'</span><table>'+sess(pw).map((s,i)=>'<tr class="'+(c.w==pw&&c.d==i?'now':'')+'"><td>'+DN[i]+'</td><td><b>'+s[0]+'</b><br>'+s[1]+'</td></tr>').join('')+'</table></div>';
PN.forEach((n,i)=>h+='<div class="c"><div class="big">Phase '+(i+1)+' - Weeks '+(i*12+1)+'-'+(i*12+12)+'</div><div class="mu">'+PD[i]+'</div></div>');
h+=extra()+'<h2>Roadmap</h2><div class="c"><table>'+RM.map(r=>'<tr><td style="width:96px">'+r[0].split(' (')[0]+'</td><td>'+r[1]+'</td></tr>').join('')+'</table></div><h2>Settings</h2><div class="c"><label style="margin-top:0">Start date (a Monday)</label><input id="sd" type="date" value="'+S.start+'"><label>Start weight (kg)</label><input id="w0" type="number" step=".1" value="'+S.w0+'"></div><h2>Backup your data</h2><div class="c"><div class="mu">Saved on this device. Export a copy so you never lose progress.</div><textarea id="bk" rows="3" style="margin-top:8px"></textarea><div class="seg" style="margin-top:8px"><button class="btn" id="ex">Export backup</button><button class="btn" id="im">Import backup</button></div></div>';
V.innerHTML=h;$('ws').onchange=e=>{pw=+e.target.value;prog()};$('sd').onchange=e=>{S.start=e.target.value;sv();head();toast('Updated')};$('w0').onchange=e=>{S.w0=+e.target.value;sv();toast('Updated')};
$('ex').onclick=()=>{$('bk').value=JSON.stringify(S);$('bk').select()};$('im').onclick=()=>{try{S=JSON.parse($('bk').value);sv();head();toast('Imported');prog()}catch(e){alert('Invalid backup')}}}
const LF=[['Back squat','Mon','4x8|4x6|3x6|3x6'],['Romanian deadlift','Mon','3x10|3x8|2x8|2x8'],['Leg press','Mon','3x12|3x12|2x12|2x12'],['Leg curl','Mon','3x12|3x12|2x12|2x12'],['Calf raise','Mon','4x15|4x15|3x15|3x15'],['Bench press','Wed','4x8|4x6|4x6|4x6'],['Pull-up / lat pulldown','Wed','4x10|4x8|4x8|4x8'],['Overhead press','Wed','3x10|3x8|3x8|3x8'],['Chest-supported row','Wed','3x10|3x10|3x10|3x10'],['Lateral raise (per hand)','Wed','3x15|3x15|3x15|3x15'],['Biceps curl','Wed','3x12|3x12|3x12|3x12'],['Triceps extension','Wed','3x12|3x12|3x12|3x12'],['Deadlift','Fri','3x5|3x5|2x5|2x5'],['Front squat','Fri','3x8|3x8|2x8|2x8'],['Incline DB press (per hand)','Fri','3x10|3x10|2x10|2x10'],['Seated row','Fri','3x12|3x12|2x12|2x12'],['Walking lunges (per hand)','Fri','3x20|3x20|2x20|2x20'],['Farmers carry (per hand)','Fri','3x40 m|3x40 m|2x40 m|2x40 m']];let sw=null;
function strength(){S.str=S.str||{};const c=info(td);if(sw==null)sw=Math.min(48,Math.max(1,c.w));const p=(sw-1)/12|0;let o='';for(let w=1;w<=48;w++)o+='<option value="'+w+'"'+(w==sw?' selected':'')+'>Week '+w+(w%4==0?' (deload)':'')+'</option>';
let h='<h2>Strength log</h2><select id="sw">'+o+'</select><div class="mu" style="margin:8px 0">Enter your top working-set weight (kg). Add 2.5 kg upper / 5 kg lower once you hit the top reps on every set.'+(sw%4==0?' Deload week: use about 85% of your usual loads.':'')+'</div>',d='';
LF.forEach((l,i)=>{if(l[1]!=d){d=l[1];h+=(d!='Mon'?'</div>':'')+'<h2>'+{Mon:'Monday - Lower',Wed:'Wednesday - Upper',Fri:'Friday - Full body'}[d]+'</h2><div class="c">'}
const m=S.str[i]||{},pv=m[sw-1],vals=Object.values(m).map(Number).filter(x=>x>0),best=vals.length?Math.max(...vals):null;
h+='<div class="hi"><div class="row"><div><b>'+l[0]+'</b><div class="mu">'+l[2].split('|')[p]+(pv?' | last wk '+pv+' kg':'')+(best?' | best '+best:'')+'</div></div><input type="number" step=".5" data-i="'+i+'" value="'+(m[sw]||'')+'" style="width:84px;text-align:center" placeholder="kg"></div></div>'});
